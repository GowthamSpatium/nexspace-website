version: '3.8'

services:
  nexspace-frontend:
    image: nexspace-frontend:latest
    container_name: nexspace-frontend
    restart: always
    ports:
      - "80:80"
    environment:
      - RESEND_API_KEY=${RESEND_API_KEY}
      - PORT=80
      - NODE_ENV=production
    networks:
      - nexspace-net

  nexspace-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: nexspace-tunnel
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run nexspace-tunnel
    volumes:
      - ./.cloudflared:/etc/cloudflared
    networks:
      - nexspace-net

networks:
  nexspace-net:
    name: nexspace-net
